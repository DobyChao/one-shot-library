<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>专注番茄钟</title>
<style>
  :root {
    --bg: #f4f2ec; --card: #fffdf8; --ink: #2d2a24; --muted: #8d8578;
    --red: #e05545; --red-soft: #f7e3e0; --green: #3d9a6d; --shadow: 0 20px 50px rgba(60,50,30,.12);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh; display: grid; place-items: center;
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background:
      radial-gradient(800px 500px at 15% 0%, #fdf7ec, transparent),
      radial-gradient(700px 500px at 90% 100%, #eef4ee, transparent), var(--bg);
    color: var(--ink); padding: 24px;
  }
  .app { width: 360px; background: var(--card); border-radius: 28px; box-shadow: var(--shadow); padding: 34px 30px; text-align: center; }
  .modes { display: inline-flex; background: #efece3; border-radius: 999px; padding: 4px; margin-bottom: 28px; }
  .modes button {
    border: 0; background: transparent; padding: 8px 20px; border-radius: 999px; font-size: 14px;
    color: var(--muted); cursor: pointer; transition: all .25s; font-family: inherit;
  }
  .modes button.active { background: var(--card); color: var(--ink); font-weight: 700; box-shadow: 0 2px 8px rgba(60,50,30,.12); }
  .ring-wrap { position: relative; width: 220px; height: 220px; margin: 0 auto 10px; }
  svg { transform: rotate(-90deg); }
  .track { fill: none; stroke: #efece3; stroke-width: 12; }
  .bar { fill: none; stroke: var(--red); stroke-width: 12; stroke-linecap: round; transition: stroke-dashoffset .35s linear, stroke .3s; }
  .bar.rest { stroke: var(--green); }
  .time { position: absolute; inset: 0; display: grid; place-content: center; }
  .time b { font-size: 52px; font-weight: 800; letter-spacing: 1px; font-variant-numeric: tabular-nums; }
  .time span { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .controls { display: flex; gap: 12px; justify-content: center; margin: 18px 0 22px; }
  .controls button {
    border: 0; cursor: pointer; font-family: inherit; font-size: 15px; font-weight: 700;
    padding: 12px 26px; border-radius: 14px; transition: all .2s;
  }
  .primary { background: var(--red); color: #fff; box-shadow: 0 8px 18px rgba(224,85,69,.35); }
  .primary:hover { transform: translateY(-2px); }
  .primary.rest { background: var(--green); box-shadow: 0 8px 18px rgba(61,154,109,.35); }
  .secondary { background: #efece3; color: var(--muted); }
  .secondary:hover { color: var(--ink); }
  .meta { display: flex; justify-content: space-around; border-top: 1px dashed #e4dfd2; padding-top: 18px; color: var(--muted); font-size: 13px; }
  .meta b { display: block; font-size: 20px; color: var(--ink); }
</style>
</head>
<body>
<main class="app">
  <div class="modes" role="tablist">
    <button class="active" data-mode="focus" role="tab" aria-selected="true">专注</button>
    <button data-mode="rest" role="tab" aria-selected="false">休息</button>
  </div>

  <div class="ring-wrap">
    <svg width="220" height="220" viewBox="0 0 220 220">
      <circle class="track" cx="110" cy="110" r="96"></circle>
      <circle class="bar" id="bar" cx="110" cy="110" r="96"></circle>
    </svg>
    <div class="time">
      <b id="clock">25:00</b>
      <span id="phase">保持专注</span>
    </div>
  </div>

  <div class="controls">
    <button class="primary" id="toggle">开始</button>
    <button class="secondary" id="reset">重置</button>
  </div>

  <div class="meta">
    <div><b id="done">0</b>今日完成</div>
    <div><b id="streak">0</b>连续天数</div>
    <div><b>4</b>轮后长休</div>
  </div>
</main>

<script>
  const DURATION = { focus: 25 * 60, rest: 5 * 60 };
  const PHRASE = { focus: '保持专注', rest: '喝口水,看看远处' };
  const CIRC = 2 * Math.PI * 96;

  let mode = 'focus', left = DURATION.focus, timer = null;

  const $ = (id) => document.getElementById(id);
  const bar = $('bar');
  bar.style.strokeDasharray = CIRC;

  function render() {
    const m = String(Math.floor(left / 60)).padStart(2, '0');
    const s = String(left % 60).padStart(2, '0');
    $('clock').textContent = `${m}:${s}`;
    $('phase').textContent = PHRASE[mode];
    bar.style.strokeDashoffset = CIRC * (1 - left / DURATION[mode]);
    bar.classList.toggle('rest', mode === 'rest');
    $('toggle').classList.toggle('rest', mode === 'rest');
    $('toggle').textContent = timer ? '暂停' : '开始';
    document.title = `${m}:${s} · 专注番茄钟`;
  }

  function tick() {
    if (left > 1) { left--; render(); return; }
    if (mode === 'focus') { $('done').textContent = +$('done').textContent + 1; }
    switchMode(mode === 'focus' ? 'rest' : 'focus', true);
  }

  function switchMode(next, autoplay = false) {
    clearInterval(timer); timer = null;
    mode = next; left = DURATION[next];
    document.querySelectorAll('.modes button').forEach((b) => {
      const on = b.dataset.mode === mode;
      b.classList.toggle('active', on);
      b.setAttribute('aria-selected', on);
    });
    render();
    if (autoplay) start();
  }

  function start() {
    if (timer) { clearInterval(timer); timer = null; render(); return; }
    timer = setInterval(tick, 1000);
    render();
  }

  document.querySelectorAll('.modes button').forEach((b) =>
    b.addEventListener('click', () => switchMode(b.dataset.mode))
  );
  $('toggle').addEventListener('click', start);
  $('reset').addEventListener('click', () => { clearInterval(timer); timer = null; left = DURATION[mode]; render(); });

  render();
</script>
</body>
</html>
