<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>夜读 · 海报稿</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      body {
        display: grid;
        place-items: center;
        background: radial-gradient(ellipse at center, #f7f1e4 0%, #e7dcc8 68%, #d3c2a6 100%);
        color: #2a2118;
        font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, 'Songti SC', 'Noto Serif SC', serif;
      }
      main {
        max-width: 16em;
        padding: 12vh 8vw;
        text-align: center;
      }
      .kicker {
        margin: 0;
        color: #8a5a32;
        font-size: 12px;
        letter-spacing: 0.42em;
      }
      h1 {
        margin: 1.4rem 0 1rem;
        font-size: clamp(40px, 6vw, 76px);
        font-weight: 500;
        line-height: 1.28;
      }
      .meta {
        margin: 0;
        color: #6d5b48;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="kicker">NIGHT READING</p>
      <h1>灯还亮着的时候,只读一页。</h1>
      <p class="meta">第一稿 · 居中海报</p>
    </main>
  </body>
</html>
