<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 96" width="80" height="96">
  <defs>
    <linearGradient id="barkG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3D6B4F"/>
      <stop offset="100%" stop-color="#1E3A2F"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5C4033"/>
      <stop offset="100%" stop-color="#3d2a22"/>
    </linearGradient>
  </defs>
  <ellipse cx="40" cy="91" rx="20" ry="4" fill="#1E3A2F" opacity=".4"/>
  <!-- tree-spirit body -->
  <path d="M26 40 Q40 28 54 40 L58 74 Q40 88 22 74 Z" fill="url(#barkG)" stroke="#4EB8A2" stroke-width="1.4"/>
  <!-- bark rings -->
  <path d="M30 50 Q40 44 50 50" fill="none" stroke="#5C4033" stroke-width="1.2" opacity=".7"/>
  <path d="M32 60 Q40 55 48 60" fill="none" stroke="#5C4033" stroke-width="1" opacity=".55"/>
  <!-- branch arms -->
  <path d="M24 44 Q10 40 14 58" fill="none" stroke="url(#wood)" stroke-width="5" stroke-linecap="round"/>
  <path d="M56 44 Q70 38 66 56" fill="none" stroke="url(#wood)" stroke-width="5" stroke-linecap="round"/>
  <circle cx="12" cy="60" r="4" fill="#3D6B4F" stroke="#4EB8A2" stroke-width="1"/>
  <circle cx="68" cy="58" r="4" fill="#3D6B4F" stroke="#4EB8A2" stroke-width="1"/>
  <!-- head -->
  <circle cx="40" cy="26" r="13" fill="#3D6B4F" stroke="#5C4033" stroke-width="1.5"/>
  <!-- leaf hair -->
  <path d="M28 20 Q22 6 34 12 Q40 2 46 12 Q58 6 52 20" fill="#1E3A2F"/>
  <path d="M30 18 Q40 10 50 18" fill="#3D6B4F"/>
  <path d="M26 28 Q18 36 22 48" fill="none" stroke="#4EB8A2" stroke-width="2" opacity=".7" stroke-linecap="round"/>
  <path d="M54 28 Q62 36 58 48" fill="none" stroke="#4EB8A2" stroke-width="2" opacity=".7" stroke-linecap="round"/>
  <!-- eyes glowing -->
  <ellipse cx="35" cy="27" rx="2.4" ry="3" fill="#B8E8DC"/>
  <ellipse cx="45" cy="27" rx="2.4" ry="3" fill="#B8E8DC"/>
  <circle cx="35" cy="27" r="1" fill="#1E3A2F"/>
  <circle cx="45" cy="27" r="1" fill="#1E3A2F"/>
  <path d="M36 33 Q40 36 44 33" fill="none" stroke="#B8E8DC" stroke-width="1" opacity=".8"/>
  <!-- speaker / echo mark -->
  <path d="M36 48 Q40 42 44 48 Q40 54 36 48" fill="none" stroke="#4EB8A2" stroke-width="1.5"/>
  <circle cx="40" cy="48" r="2" fill="#E8A317" opacity=".7"/>
</svg>
