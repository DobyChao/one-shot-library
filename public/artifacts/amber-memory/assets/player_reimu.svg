  <line x1="37" y1="26" x2="42" y2="10" stroke="#8B5A2B" stroke-width="1.6" stroke-linecap="round"/>
  <rect x="40" y="6" width="5" height="2.2" rx=".3" fill="#F7F2E8" stroke="#5A0A14" stroke-width=".5"/>
  <path d="M41 8 L40 14 M43 8 L44 14 M42.5 8 L42.5 13" stroke="#F7F2E8" stroke-width="1.1" stroke-linecap="round"/>
  <path d="M41 8 L40 14 M43 8 L44 14 M42.5 8 L42.5 13" stroke="#5A0A14" stroke-width=".35"/>
  <!-- ofuda accent on skirt -->
  <rect x="21" y="44" width="6" height="7" rx=".4" fill="#F7F2E8" stroke="#E8A317" stroke-width=".8"/>
  <line x1="22.5" y1="46" x2="25.5" y2="46" stroke="#C41E3A" stroke-width=".6"/>
  <line x1="22.5" y1="48" x2="25.5" y2="48" stroke="#C41E3A" stroke-width=".6"/>
  <!-- head -->
  <circle cx="24" cy="16" r="9" fill="#F0C9A0" stroke="#5A0A14" stroke-width="1.2"/>
