  <path d="M15 16 C14 8 18 4 24 3.5 C30 4 34 8 33 16 C31 11 27 9 24 9 C21 9 17 11 15 16 Z" fill="#1A1208" stroke="#0A0806" stroke-width=".7"/>
  <path d="M16 15 Q19 11 22 15" fill="none" stroke="#1A1208" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M22 14 Q24 10 26 14" fill="none" stroke="#1A1208" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M26 15 Q29 11 32 15" fill="none" stroke="#1A1208" stroke-width="1.6" stroke-linecap="round"/>
  <!-- side hair red ties -->
  <circle cx="13" cy="22" r="2" fill="#C41E3A" stroke="#5A0A14" stroke-width=".7"/>
  <circle cx="35" cy="22" r="2" fill="#C41E3A" stroke="#5A0A14" stroke-width=".7"/>
  <!-- big red butterfly bow -->
  <path d="M16 6 Q20 2 24 7 Q28 2 32 6 Q28 9 24 8 Q20 9 16 6 Z" fill="#C41E3A" stroke="#5A0A14" stroke-width="1"/>
