  <!-- hair back / side locks -->
  <path d="M11 20 C8 28 9 42 12 52 C14 46 16 36 17 28 Z" fill="#1A1208" stroke="#0A0806" stroke-width=".6"/>
  <path d="M37 20 C40 28 39 42 36 52 C34 46 32 36 31 28 Z" fill="#1A1208" stroke="#0A0806" stroke-width=".6"/>
  <!-- red skirt -->
