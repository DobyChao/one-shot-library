  <ellipse cx="37" cy="32" rx="5" ry="7" fill="#F7F2E8" stroke="#5A0A14" stroke-width="1"/>
  <circle cx="11" cy="26" r="2.2" fill="#F0C9A0" stroke="#5A0A14" stroke-width=".6"/>
  <circle cx="37" cy="26" r="2.2" fill="#F0C9A0" stroke="#5A0A14" stroke-width=".6"/>
