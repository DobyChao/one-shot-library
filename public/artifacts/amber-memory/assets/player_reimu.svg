<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 64" width="48" height="64">
  <defs>
    <linearGradient id="skirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C41E3A"/>
      <stop offset="100%" stop-color="#8B1428"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8A317"/>
      <stop offset="100%" stop-color="#C41E3A"/>
    </linearGradient>
  </defs>
  <ellipse cx="24" cy="60" rx="11" ry="3.5" fill="#2A2218" opacity=".28"/>
  <!-- hair back -->
  <path d="M10 22 Q8 40 12 52 Q16 44 18 30 Z" fill="#2A2218"/>
  <path d="M38 22 Q40 40 36 52 Q32 44 30 30 Z" fill="#2A2218"/>
  <!-- skirt -->
  <path d="M14 34 L34 34 L38 54 Q24 58 10 54 Z" fill="url(#skirt)" stroke="#8B1428" stroke-width=".8"/>
  <path d="M16 34 L32 34 L33 40 L15 40 Z" fill="#F7F2E8" opacity=".9"/>
  <!-- torso -->
  <rect x="18" y="26" width="12" height="10" rx="2" fill="#F7F2E8" stroke="#C41E3A" stroke-width="1"/>
  <!-- sleeves / arms -->
  <path d="M10 28 L18 30 L17 40 L8 38 Z" fill="#F7F2E8" stroke="#C41E3A" stroke-width=".9"/>
  <path d="M38 28 L30 30 L31 40 L40 38 Z" fill="#F7F2E8" stroke="#C41E3A" stroke-width=".9"/>
  <!-- head -->
  <circle cx="24" cy="16" r="9" fill="#F7F2E8" stroke="#C41E3A" stroke-width="1.2"/>
  <!-- hair top / bangs -->
  <path d="M14 14 Q24 2 34 14 Q30 10 24 11 Q18 10 14 14" fill="#2A2218"/>
  <path d="M16 18 Q20 12 24 16" fill="none" stroke="#2A2218" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M28 18 Q26 13 24 16" fill="none" stroke="#2A2218" stroke-width="1.2" stroke-linecap="round"/>
  <!-- gohei ribbon -->
  <path d="M20 8 L24 4 L28 8 L24 10 Z" fill="url(#ribbon)" stroke="#B86E00" stroke-width=".6"/>
  <circle cx="24" cy="7" r="1.6" fill="#FFD966"/>
  <!-- face dots -->
  <circle cx="21" cy="17" r="1" fill="#2A2218"/>
  <circle cx="27" cy="17" r="1" fill="#2A2218"/>
  <path d="M22 20 Q24 22 26 20" fill="none" stroke="#C41E3A" stroke-width=".8" stroke-linecap="round"/>
  <!-- ofuda accent -->
  <rect x="21" y="42" width="6" height="8" rx="0.5" fill="#F7F2E8" stroke="#E8A317" stroke-width=".7"/>
  <!-- hitbox comment layer (invisible) -->
  <circle cx="24" cy="36" r="3" fill="#FFD966" opacity="0" id="hitbox"/>
</svg>
