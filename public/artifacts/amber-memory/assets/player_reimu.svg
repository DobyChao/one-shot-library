  <ellipse cx="28" cy="6.5" rx="3.2" ry="2.4" fill="#E03050" stroke="#5A0A14" stroke-width=".6"/>
  <circle cx="24" cy="7" r="1.8" fill="#E8A317" stroke="#8B1428" stroke-width=".7"/>
