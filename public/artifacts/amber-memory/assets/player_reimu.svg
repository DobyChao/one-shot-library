  <ellipse cx="20.5" cy="17" rx="2.2" ry="2.6" fill="#2A1810" stroke="#0A0806" stroke-width=".5"/>
  <ellipse cx="27.5" cy="17" rx="2.2" ry="2.6" fill="#2A1810" stroke="#0A0806" stroke-width=".5"/>
  <circle cx="21.2" cy="16.2" r=".7" fill="#F7F2E8"/>
  <circle cx="28.2" cy="16.2" r=".7" fill="#F7F2E8"/>
  <!-- mouth -->
  <path d="M22 21 Q24 22.5 26 21" fill="none" stroke="#8B1428" stroke-width=".9" stroke-linecap="round"/>
  <!-- hitbox marker (invisible) -->
  <circle cx="24" cy="36" r="3" fill="#FFD966" opacity="0" id="hitbox"/>
