  <path d="M26 30 Q18 40 22 52" fill="none" stroke="#E8A317" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M54 30 Q62 40 58 52" fill="none" stroke="#E8A317" stroke-width="2.2" stroke-linecap="round"/>
  <!-- eyes -->
  <ellipse cx="35" cy="27" rx="2.4" ry="3" fill="#0E2430"/>
  <ellipse cx="45" cy="27" rx="2.4" ry="3" fill="#0E2430"/>
  <circle cx="35.8" cy="26" r=".8" fill="#F7F2E8"/>
  <circle cx="45.8" cy="26" r=".8" fill="#F7F2E8"/>
  <path d="M37 33 Q40 35.5 43 33" fill="none" stroke="#6B3A00" stroke-width="1.1" stroke-linecap="round"/>
