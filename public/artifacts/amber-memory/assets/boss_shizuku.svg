  <path d="M32 64 Q40 60 48 64" fill="none" stroke="#6B8F5E" stroke-width="1.2"/>
  <!-- arms -->
  <path d="M26 44 L14 58" stroke="#1E4A5C" stroke-width="6" stroke-linecap="round"/>
  <path d="M54 44 L66 56" stroke="#1E4A5C" stroke-width="6" stroke-linecap="round"/>
  <circle cx="12" cy="60" r="3.5" fill="#E8C090" stroke="#0A2430" stroke-width=".8"/>
  <circle cx="68" cy="58" r="3.5" fill="#E8C090" stroke="#0A2430" stroke-width=".8"/>
  <!-- broken amber gourd -->
  <ellipse cx="16" cy="72" rx="10" ry="8" fill="#E8A317" stroke="#6B3A00" stroke-width="1.4"/>
  <path d="M10 66 Q16 60 22 66" fill="none" stroke="#6B3A00" stroke-width="1.3"/>
  <path d="M8 70 L14 78" stroke="#0A2430" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="14" cy="70" r="2" fill="#FFD966"/>
  <circle cx="19" cy="74" r="1.4" fill="#FFE8A0"/>
