<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 96" width="80" height="96">
  <defs>
    <linearGradient id="dress" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2E5A6B"/>
      <stop offset="100%" stop-color="#1A3A4A"/>
    </linearGradient>
    <linearGradient id="amberG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD966" stop-opacity=".85"/>
      <stop offset="55%" stop-color="#E8A317" stop-opacity=".7"/>
      <stop offset="100%" stop-color="#B86E00" stop-opacity=".9"/>
    </linearGradient>
    <radialGradient id="faceG" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#F5D78E"/>
      <stop offset="100%" stop-color="#E8A317"/>
    </radialGradient>
  </defs>
  <ellipse cx="40" cy="91" rx="20" ry="4" fill="#1A3A4A" opacity=".35"/>
  <!-- dress / body -->
  <path d="M26 38 Q40 28 54 38 L56 72 Q40 86 24 72 Z" fill="url(#dress)" stroke="#E8A317" stroke-width="1.4"/>
  <!-- water ripple trim -->
  <path d="M28 48 Q40 42 52 48" fill="none" stroke="#F5D78E" stroke-width="1.2" opacity=".75"/>
  <path d="M30 58 Q40 52 50 58" fill="none" stroke="#6B8F5E" stroke-width="1" opacity=".55"/>
  <!-- arms -->
  <path d="M22 42 Q14 52 18 64" fill="none" stroke="#2E5A6B" stroke-width="5" stroke-linecap="round"/>
  <path d="M58 42 Q66 50 62 62" fill="none" stroke="#2E5A6B" stroke-width="5" stroke-linecap="round"/>
  <!-- broken gourd with amber -->
  <ellipse cx="18" cy="70" rx="11" ry="9" fill="url(#amberG)" stroke="#B86E00" stroke-width="1.3"/>
  <path d="M12 64 Q18 58 24 64" fill="none" stroke="#B86E00" stroke-width="1.2"/>
  <path d="M14 78 Q18 84 22 78" fill="none" stroke="#1A3A4A" stroke-width="1.5" opacity=".7"/>
  <circle cx="16" cy="68" r="1.8" fill="#FFD966" opacity=".9"/>
  <circle cx="21" cy="72" r="1.2" fill="#F5D78E" opacity=".8"/>
  <!-- hourglass motif on chest -->
  <path d="M36 46 L40 54 L44 46 L40 50 Z" fill="none" stroke="#E8A317" stroke-width="1.5"/>
  <ellipse cx="40" cy="54" rx="5" ry="7" fill="none" stroke="#FFD966" stroke-width="1.2" opacity=".85"/>
  <path d="M37 54 L43 54" stroke="#B86E00" stroke-width="1"/>
  <!-- head -->
  <circle cx="40" cy="26" r="13" fill="url(#faceG)" stroke="#B86E00" stroke-width="1.5"/>
  <!-- hair / water tendrils -->
  <path d="M28 22 Q22 8 34 12 Q40 4 46 12 Q58 8 52 22" fill="#1A3A4A" opacity=".85"/>
  <path d="M27 28 Q20 36 24 48" fill="none" stroke="#E8A317" stroke-width="2" stroke-linecap="round" opacity=".7"/>
  <path d="M53 28 Q60 36 56 48" fill="none" stroke="#E8A317" stroke-width="2" stroke-linecap="round" opacity=".7"/>
  <!-- bangs -->
  <path d="M30 22 Q40 16 50 22 Q44 20 40 21 Q36 20 30 22" fill="#2E5A6B"/>
  <!-- eyes -->
  <ellipse cx="35" cy="27" rx="2.2" ry="2.8" fill="#1A3A4A"/>
  <ellipse cx="45" cy="27" rx="2.2" ry="2.8" fill="#1A3A4A"/>
  <circle cx="35.5" cy="26" r=".7" fill="#F7F2E8"/>
  <circle cx="45.5" cy="26" r=".7" fill="#F7F2E8"/>
  <!-- soft smile -->
  <path d="M37 32 Q40 34.5 43 32" fill="none" stroke="#B86E00" stroke-width="1" stroke-linecap="round"/>
  <!-- reed accent behind -->
  <path d="M62 70 L64 50 L66 70" fill="#6B8F5E" opacity=".45"/>
</svg>
