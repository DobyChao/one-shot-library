  <ellipse cx="40" cy="60" rx="5" ry="6" fill="none" stroke="#FFD966" stroke-width="1.4"/>
  <line x1="37" y1="60" x2="43" y2="60" stroke="#B86E00" stroke-width="1.2"/>
  <!-- head -->
  <circle cx="40" cy="26" r="13" fill="#E8C090" stroke="#0A2430" stroke-width="1.5"/>
