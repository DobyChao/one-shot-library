  <path d="M27 24 C26 10 34 6 40 5 C46 6 54 10 53 24 C50 16 44 14 40 14 C36 14 30 16 27 24 Z" fill="#0E2430" stroke="#061018" stroke-width=".8"/>
  <path d="M28 20 Q40 12 52 20" fill="#1E4A5C"/>
