<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 448" width="384" height="448" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="sphere" cx="50%" cy="28%" r="55%">
      <stop offset="0%" stop-color="#F2C14E" stop-opacity=".35"/>
      <stop offset="40%" stop-color="#6B4C7A" stop-opacity=".25"/>
      <stop offset="100%" stop-color="#1A1430" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0a18"/>
      <stop offset="55%" stop-color="#1A1430"/>
      <stop offset="100%" stop-color="#2a1838"/>
    </linearGradient>
  </defs>
  <rect width="384" height="448" fill="url(#sky)"/>
  <ellipse cx="192" cy="120" rx="160" ry="160" fill="url(#sphere)"/>
  <!-- celestial sphere arc -->
  <circle cx="192" cy="110" r="70" fill="none" stroke="#F2C14E" stroke-width="1.5" opacity=".4"/>
  <circle cx="192" cy="110" r="95" fill="none" stroke="#6B4C7A" stroke-width="1" opacity=".35"/>
  <circle cx="192" cy="110" r="40" fill="#F2C14E" opacity=".2"/>
  <!-- stars -->
  <g fill="#FFE6A0">
    <circle cx="40" cy="60" r="1.5"/><circle cx="80" cy="40" r="1"/><circle cx="320" cy="50" r="1.5"/>
    <circle cx="350" cy="120" r="1"/><circle cx="30" cy="180" r="1.2"/><circle cx="300" cy="200" r="1"/>
    <circle cx="100" cy="220" r="1"/><circle cx="260" cy="80" r="1.3"/>
  </g>
  <!-- dusk band -->
  <path d="M0 280 Q192 240 384 280 L384 448 L0 448 Z" fill="#6B4C7A" opacity=".35"/>
  <path d="M0 320 Q192 290 384 320" fill="none" stroke="#F2C14E" stroke-width="1" opacity=".25"/>
  <!-- tree tip below -->
  <path d="M192 360 L210 448 L174 448 Z" fill="#D4890A" opacity=".3"/>
</svg>
