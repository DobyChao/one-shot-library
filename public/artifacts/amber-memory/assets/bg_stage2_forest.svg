<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 448" width="384" height="448" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1a14"/>
      <stop offset="35%" stop-color="#1E3A2F"/>
      <stop offset="70%" stop-color="#2a4a38"/>
      <stop offset="100%" stop-color="#1E3A2F"/>
    </linearGradient>
    <linearGradient id="fog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B8E8DC" stop-opacity="0"/>
      <stop offset="100%" stop-color="#B8E8DC" stop-opacity=".12"/>
    </linearGradient>
  </defs>
  <rect width="384" height="448" fill="url(#sky)"/>
  <!-- distant trees -->
  <g fill="#1E3A2F" opacity=".85">
    <path d="M40 448 L70 120 L100 448 Z"/><path d="M90 448 L115 160 L140 448 Z"/>
    <path d="M250 448 L280 100 L310 448 Z"/><path d="M300 448 L330 150 L360 448 Z"/>
  </g>
  <!-- mid pines -->
  <g>
    <path d="M20 448 L55 80 L90 448 Z" fill="#3D6B4F"/>
    <rect x="50" y="280" width="10" height="168" fill="#5C4033"/>
    <path d="M120 448 L155 60 L190 448 Z" fill="#3D6B4F" opacity=".9"/>
    <rect x="150" y="260" width="10" height="188" fill="#5C4033"/>
    <path d="M200 448 L235 90 L270 448 Z" fill="#2f5740"/>
    <rect x="230" y="270" width="10" height="178" fill="#5C4033"/>
    <path d="M310 448 L345 70 L380 448 Z" fill="#3D6B4F"/>
    <rect x="340" y="265" width="10" height="183" fill="#5C4033"/>
  </g>
  <!-- path / ground -->
  <ellipse cx="192" cy="420" rx="200" ry="50" fill="#0d1a14" opacity=".5"/>
  <path d="M80 400 Q192 360 304 400" fill="none" stroke="#5C4033" stroke-width="2" opacity=".35"/>
  <!-- echo pale ghost silhouettes -->
  <g opacity=".2" fill="#B8E8DC" stroke="#4EB8A2" stroke-width="1">
    <ellipse cx="100" cy="200" rx="12" ry="22"/>
    <ellipse cx="280" cy="180" rx="10" ry="20"/>
    <ellipse cx="190" cy="140" rx="8" ry="16"/>
  </g>
  <!-- amber rain flecks -->
  <g fill="#E8A317" opacity=".3">
    <circle cx="60" cy="150" r="2"/><circle cx="160" cy="110" r="1.5"/>
    <circle cx="220" cy="170" r="2"/><circle cx="320" cy="130" r="1.8"/>
    <circle cx="140" cy="240" r="1.5"/><circle cx="260" cy="260" r="2"/>
  </g>
  <rect width="384" height="448" fill="url(#fog)"/>
</svg>
