<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 448" width="384" height="448" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A2218"/>
      <stop offset="45%" stop-color="#2A3328"/>
      <stop offset="100%" stop-color="#1A3A4A"/>
    </linearGradient>
  </defs>
  <rect width="384" height="448" fill="url(#sky)"/>
  <!-- mountain gate silhouette -->
  <path d="M60 160 L60 80 L324 80 L324 160" fill="none" stroke="#5C4033" stroke-width="8"/>
  <path d="M40 80 L192 30 L344 80 Z" fill="#6B3A2A" opacity=".85"/>
  <rect x="150" y="100" width="84" height="100" fill="#1A1A1A" opacity=".55"/>
  <!-- amber sealed cracks on gate -->
  <g stroke="#E8A317" stroke-width="1.5" opacity=".55" fill="none">
    <path d="M90 100 L110 130 L95 150"/><path d="M280 95 L270 140 L290 155"/>
  </g>
  <g fill="#E8A317" opacity=".4">
    <circle cx="108" cy="128" r="3"/><circle cx="275" cy="138" r="2.5"/>
  </g>
  <!-- stone stairs -->
  <g fill="#5A6B52">
    <rect x="48" y="200" width="288" height="22" opacity=".7"/>
    <rect x="64" y="230" width="256" height="22" opacity=".75"/>
    <rect x="80" y="260" width="224" height="22" opacity=".8"/>
    <rect x="96" y="290" width="192" height="22" opacity=".85"/>
    <rect x="112" y="320" width="160" height="22" opacity=".9"/>
    <rect x="128" y="350" width="128" height="22"/>
    <rect x="144" y="380" width="96" height="22"/>
  </g>
  <g stroke="#3d4a38" stroke-width="1" opacity=".5" fill="none">
    <line x1="48" y1="200" x2="336" y2="200"/>
    <line x1="64" y1="230" x2="320" y2="230"/>
    <line x1="80" y1="260" x2="304" y2="260"/>
  </g>
  <!-- moss -->
  <ellipse cx="70" cy="245" rx="18" ry="6" fill="#3D6B4F" opacity=".45"/>
  <ellipse cx="310" cy="275" rx="22" ry="7" fill="#3D6B4F" opacity=".4"/>
  <!-- floating amber shards -->
  <g fill="#D4A84B" opacity=".45">
    <circle cx="50" cy="180" r="2.5"/><circle cx="330" cy="190" r="2"/>
    <circle cx="100" cy="340" r="2"/><circle cx="280" cy="360" r="2.5"/>
  </g>
</svg>
