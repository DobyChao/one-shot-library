<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>柜台 · 清单稿</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      body {
        display: grid;
        place-items: center;
        background: #e7eee6;
        color: #1d2a22;
        font-family: ui-sans-serif, system-ui, 'PingFang SC', 'Noto Sans SC', sans-serif;
      }
      form {
        width: min(420px, calc(100% - 3rem));
        margin: 8vh auto;
        padding: 1.6rem 1.5rem 1.4rem;
        border: 1px solid #b7c7b6;
        background: #f7fbf6;
      }
      h1 {
        margin: 0 0 0.3rem;
        font-size: 1.35rem;
      }
      .sub {
        margin: 0 0 1.2rem;
        color: #5d6e63;
        font-size: 0.85rem;
      }
      label {
        display: flex;
        gap: 0.7rem;
        align-items: center;
        padding: 0.7rem 0;
        border-top: 1px solid #d5e0d4;
        font-size: 0.98rem;
      }
      input {
        width: 1rem;
        height: 1rem;
        accent-color: #2f6b45;
      }
      button {
        margin-top: 1rem;
        padding: 0.55rem 0.9rem;
        border: 0;
        background: #2f6b45;
        color: white;
        font: inherit;
      }
      input,
      button {
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <form>
      <h1>今日柜台</h1>
      <p class="sub">第一稿 · 还是一张要勾完的清单</p>
      <label><input type="checkbox" checked /> 晨间接班</label>
      <label><input type="checkbox" /> 找零核对</label>
      <label><input type="checkbox" /> 把便签贴回原处</label>
      <button type="button">提交清单</button>
    </form>
  </body>
</html>
