site:
  name: One-Shot Library
  site: 'https://dobychao.github.io'
  base: '/one-shot-library'
  trailingSlash: false

  googleSiteVerificationId: false

# Default SEO metadata
metadata:
  title:
    default: One-Shot Library
    template: '%s — One-Shot Library'
  description: '一间 vibecoding 产物画廊。一轮写成的和改过许多轮的页面都在,旁边留着当时的 prompt、工具和轮数,HTML 也可以打开。'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: One-Shot Library
    images:
      - url: '~/assets/images/default.png'
        width: 1200
        height: 628
    type: website

i18n:
  language: zh-CN
  textDirection: ltr

apps:
  blog:
    isEnabled: false

analytics:
  vendors:
    googleAnalytics:
      id: null # or "G-XXXXXXXXXX"

ui:
  theme: 'system' # Values: "system" | "light" | "dark" | "light:only" | "dark:only"
