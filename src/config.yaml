site:
  name: One-Shot Library
  site: 'https://dobychao.github.io'
  base: '/one-shot-library'
  trailingSlash: false

  googleSiteVerificationId: false

# Default SEO metadata
metadata:
  title:
    default: One-Shot Library
    template: '%s — One-Shot Library'
  description: '收录 AI 做的前端小页面。每件留着当时的 prompt、对话、工具、模型和能打开的 HTML。只改一轮的和改过几轮的都有。'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: One-Shot Library
    images:
      - url: '~/assets/images/default.png'
        width: 1200
        height: 628
    type: website

i18n:
  language: zh-CN
  textDirection: ltr

apps:
  blog:
    isEnabled: false

analytics:
  vendors:
    googleAnalytics:
      id: null # or "G-XXXXXXXXXX"

ui:
  theme: 'system' # Values: "system" | "light" | "dark" | "light:only" | "dark:only"
